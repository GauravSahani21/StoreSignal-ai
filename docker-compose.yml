services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: storesignal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: storesignal
      POSTGRES_PASSWORD: storesignal_dev_pwd
      POSTGRES_DB: storesignal_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storesignal -d storesignal_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: storesignal_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://storesignal:storesignal_dev_pwd@postgres:5432/storesignal_dev
      APP_URL: http://localhost:80
      OPENROUTER_MODEL: google/gemini-2.5-flash
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: storesignal_web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
