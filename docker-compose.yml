services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: storesignal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: storesignal
      POSTGRES_PASSWORD: storesignal_dev_pwd
      POSTGRES_DB: storesignal_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storesignal -d storesignal_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
